# Selected automatically by ./dev only when matching local driver libraries exist.
services:
  engine:
    runtime: runc
    gpus: !reset []
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    environment:
      VI_DRIVER_COMPAT: "1"
