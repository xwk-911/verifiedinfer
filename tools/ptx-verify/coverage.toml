ract under its actual geometry/bindings and represented-zero flag initialization. Arbitrary oracles, candidate order, every finite polling prefix, RF/coherence and synchronized observers are quantified. Source reconstruction derives aligned four-byte accesses and unique byte writers; flag eligibility and zero initialization derive the final release/acquire observation, which forces payload/output 42. DATA=42, FLAG=1 and all unwritten observed bytes follow separately from observer constraints. An independent complete legal execution exists under the same Pre, and the earlier existence witness for arbitrary initial bytes remains. A typed complete wrong-payload source candidate in reversed trace order is rejected for ALL RF/coherence choices. No auxiliary assumption is used. Termination/fairness, fences, extended patterns, ordered atomics, ordered Iris lifting, host/multi-device scope, shuffle/async/tensor composition and physical ISA/runtime correspondence remain open. Exact paper instruction parity is unconfirmed."
