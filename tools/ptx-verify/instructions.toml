# Local opcode spellings and executable probes. No inferred 81-form parity.
schema_version = 1

[paper]
url = "https://sf-tensor.com/papers/formalizing-ptx.pdf"
section = "5.1"
forms = 81
groups = {scalar_control_memory = 66, ampere = 5, hopper = 10}
mapping_status = "unconfirmed"
gap = "The paper supplies group counts, but no enumerated opcode/qualifier inventory was located. Every local form remains unmapped. Counts use different conventions: the local list includes an alias and separately records operand restrictions; 81 minus the local count is not a missing-form count."

[profiles.integer]
version = "7.0"
target = "sm_70"
declarations = ".reg .u32 %r0;\n.reg .u32 %r1;\n.reg .u64 %rd0;\n.reg .u64 %rd1;\n.reg .pred %p;\n.shared .align 16 .b8 tile[64];"

